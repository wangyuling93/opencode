# Fork-local Apple Silicon release: signed/notarized/stapled macOS arm64 DMG
# of real opencode2 (same lineage as upstream @opencode-ai/cli / npm `opencode2`).
#
# Default (source=repo):
#   Build packages/cli from this checkout with OPENCODE_CLI_BINARY=opencode2.
#   That is the OpenCode 2.0 CLI entry (Effect CLI + default handler → TUI).
#   Workspace @opencode-ai/tui is linked in, so fork patches (e.g. /transparent) ship.
#
# Optional (source=npm):
#   Sign official @opencode-ai/cli-darwin-arm64 (no fork TUI patches).
#
# Not: packages/opencode renamed to opencode2 (classic full product, wrong lineage).
#
# UX: Actions → macos-arm64-opencode2-cli → Run workflow (defaults are enough)
#
# Asset: opencode2-cli-mac-arm64.dmg
# Tag:   macos-arm64-opencode2-v{version}-{7-char commit sha}

name: macos-arm64-opencode2-cli

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built asset
        required: false
        type: boolean
        default: true
      source:
        description: >-
          Binary source. "repo" builds packages/cli as opencode2 from this checkout
          (real 2.0 CLI + workspace TUI /transparent). "npm" signs official next only.
        required: false
        type: choice
        options:
          - repo
          - npm
        default: repo
      npm_dist_tag:
        description: npm dist-tag when source=npm
        required: false
        type: choice
        options:
          - next
          - beta
          - latest
          - dev
        default: next
      npm_version:
        description: Exact npm version when source=npm (optional; overrides dist-tag)
        required: false
        type: string
        default: ""
      channel:
        description: Channel baked into repo builds (OPENCODE_CHANNEL)
        required: false
        type: choice
        options:
          - next
          - dev
          - beta
          - prod
        default: next
      sourcemaps:
        description: Repo builds only — linked sourcemaps (larger binary)
        required: false
        type: boolean
        default: false
      skip_embed_web_ui:
        description: Unused for packages/cli builds (kept for workflow UI compat)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.source }}-${{ inputs.npm_version || inputs.npm_dist_tag || inputs.channel }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      npm_spec: ${{ steps.resolve.outputs.npm_spec }}
      source: ${{ steps.resolve.outputs.source }}
      cli_channel: ${{ steps.resolve.outputs.cli_channel }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_NPM_TAG: ${{ inputs.npm_dist_tag }}
          INPUT_NPM_VERSION: ${{ inputs.npm_version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          source_mode="${INPUT_SOURCE:-repo}"
          short_sha="${GITHUB_SHA:0:7}"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{7}$ ]]; then
            echo "Invalid GITHUB_SHA" >&2
            exit 1
          fi

          channel="${INPUT_CHANNEL:-next}"
          case "$channel" in
            prod) cli_channel="latest" ;;
            next|dev|beta) cli_channel="$channel" ;;
            *) echo "Unsupported channel: $channel" >&2; exit 1 ;;
          esac

          npm_spec=""
          if [[ "$source_mode" == "npm" ]]; then
            if [[ -n "${INPUT_NPM_VERSION:-}" ]]; then
              npm_spec="@opencode-ai/cli-darwin-arm64@${INPUT_NPM_VERSION}"
            else
              npm_spec="@opencode-ai/cli-darwin-arm64@${INPUT_NPM_TAG:-next}"
            fi
            release_version="$(npm view "$npm_spec" version)"
            if [[ -z "$release_version" ]]; then
              echo "Could not resolve version for $npm_spec" >&2
              exit 1
            fi
            version_source="npm ${npm_spec}"
          else
            # Repo build: preview version tied to channel + UTC stamp
            stamp="$(date -u +%Y%m%d%H%M)"
            release_version="0.0.0-${cli_channel}-${stamp}"
            version_source="repo packages/cli (opencode2) + workspace packages/tui"
          fi

          release_tag="macos-arm64-opencode2-v${release_version}-${short_sha}"
          release_name="${release_version} (macos-arm64-opencode2 ${short_sha})"

          {
            echo "release_tag=${release_tag}"
            echo "release_version=${release_version}"
            echo "release_name=${release_name}"
            echo "npm_spec=${npm_spec}"
            echo "source=${source_mode}"
            echo "cli_channel=${cli_channel}"
          } >>"$GITHUB_OUTPUT"

          echo "source=${source_mode} version=${release_version} channel=${cli_channel} from ${version_source}; tag=${release_tag}"

  package-cli:
    needs: resolve-version
    name: opencode2 CLI DMG
    runs-on: macos-latest
    timeout-minutes: 120
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}

      # ── npm: official binary (no fork TUI features) ─────────────────────────
      - name: Stage official npm binary
        if: needs.resolve-version.outputs.source == 'npm'
        id: stage_npm
        shell: bash
        env:
          NPM_SPEC: ${{ needs.resolve-version.outputs.npm_spec }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/opencode2-npm"
          rm -rf "$stage" && mkdir -p "$stage" && cd "$stage"
          tarball="$(npm pack "$NPM_SPEC" --silent)"
          tar -xzf "$tarball"
          binary=""
          for candidate in package/bin/opencode2 package/bin/lildax package/bin/opencode2.exe package/bin/lildax.exe; do
            if [[ -f "$candidate" ]]; then binary="$candidate"; break; fi
          done
          if [[ -z "$binary" ]]; then
            echo "No CLI binary in $NPM_SPEC" >&2
            tar -tzf "$tarball" | head -40 >&2 || true
            exit 1
          fi
          install -m 0755 "$binary" "${RUNNER_TEMP}/opencode2"
          ls -lah "${RUNNER_TEMP}/opencode2"
          file "${RUNNER_TEMP}/opencode2"
          lipo "${RUNNER_TEMP}/opencode2" -verify_arch arm64
          echo "path=${RUNNER_TEMP}/opencode2" >>"$GITHUB_OUTPUT"

      # ── repo: packages/cli as opencode2 + workspace packages/tui (/transparent) ─
      - uses: ./.github/actions/setup-bun
        if: needs.resolve-version.outputs.source == 'repo'
        with:
          install-flags: --os=darwin --cpu=arm64

      - name: Assert real opencode2 sources + /transparent in this checkout
        if: needs.resolve-version.outputs.source == 'repo'
        shell: bash
        run: |
          set -euo pipefail
          # Use grep (not rg): macOS GitHub-hosted runners do not ship ripgrep.
          # Real opencode2 entry = packages/cli default handler → @opencode-ai/tui.
          grep -nF 'from "@opencode-ai/tui"' packages/cli/src/tui.ts
          grep -nF 'import("../../tui")' packages/cli/src/commands/handlers/default.ts
          grep -nF 'OpenCode 2.0 preview' packages/cli/src/commands/commands.ts
          # Fork TUI patches live in workspace packages/tui (linked at compile time).
          grep -nF 'slashName: "transparent"' packages/tui/src/app.tsx
          grep -nF 'export function applyUiTransparency' packages/tui/src/theme/index.ts
          echo "opencode2 sources + transparent markers found"

      - name: Build real opencode2 from packages/cli
        if: needs.resolve-version.outputs.source == 'repo'
        id: stage_repo
        shell: bash
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.cli_channel }}
          # Same binary name as upstream npm @opencode-ai/cli@next (not a rename of opencode).
          OPENCODE_CLI_BINARY: opencode2
        run: |
          set -euo pipefail
          args=(--single)
          if [[ "${{ inputs.sourcemaps }}" == "true" ]]; then
            args+=(--sourcemaps)
          fi
          # Real OpenCode 2.0 CLI package (packages/cli), not packages/opencode.
          ./packages/cli/script/build.ts "${args[@]}"
          built="packages/cli/dist/cli-darwin-arm64/bin/opencode2"
          if [[ ! -f "$built" ]]; then
            echo "Missing $built" >&2
            ls -lahR packages/cli/dist || true
            exit 1
          fi
          # Default handler embeds workspace @opencode-ai/tui — transparent must ship.
          if ! grep -aEq 'ui_transparent|Enable transparent UI|toggle-transparent' "$built"; then
            echo "Built opencode2 does not contain transparent UI markers" >&2
            ls -lah "$built" >&2
            exit 1
          fi
          echo "transparent UI markers present in built opencode2"
          install -m 0755 "$built" "${RUNNER_TEMP}/opencode2"
          ls -lah "${RUNNER_TEMP}/opencode2"
          echo "path=${RUNNER_TEMP}/opencode2" >>"$GITHUB_OUTPUT"

      - name: Verify staged binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          BINARY_PATH: ${{ steps.stage_npm.outputs.path || steps.stage_repo.outputs.path }}
          SOURCE: ${{ needs.resolve-version.outputs.source }}
        run: |
          set -euo pipefail
          binary="${BINARY_PATH:?missing staged binary path}"
          chmod 0755 "$binary"
          ls -lah "$binary"
          file "$binary"
          lipo "$binary" -verify_arch arm64
          version_output="$("$binary" --version)"
          echo "version: $version_output"
          [[ "$version_output" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected --version to contain ${RELEASE_VERSION}, got: ${version_output}" >&2; exit 1; }
          bytes="$(wc -c <"$binary" | tr -d ' ')"
          echo "binary_bytes=${bytes}"
          help_output="$("$binary" --help 2>&1 || true)"
          echo "$help_output" | head -80
          if [[ "$SOURCE" == "repo" ]]; then
            # OpenCode 2.0 CLI surface (packages/cli), not classic packages/opencode.
            if ! grep -Fq 'OpenCode 2.0 preview' <<<"$help_output"; then
              echo "Repo build help missing OpenCode 2.0 preview description" >&2
              echo "$help_output" >&2
              exit 1
            fi
            for needle in api service serve migrate; do
              if ! grep -Fq "$needle" <<<"$help_output"; then
                echo "Repo build help missing opencode2 surface marker: ${needle}" >&2
                echo "$help_output" >&2
                exit 1
              fi
            done
            echo "opencode2 CLI help surface present (api/service/serve/migrate)"
            if ! grep -aEq 'Enable transparent UI|ui_transparent|toggle-transparent' "$binary"; then
              echo "Repo build missing /transparent command markers" >&2
              exit 1
            fi
            echo "transparent command markers present in binary"
          fi

      - name: Sign, notarize, and staple opencode2 DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY_PATH: ${{ steps.stage_npm.outputs.path || steps.stage_repo.outputs.path }}
          BINARY_NAME: opencode2
          OUTPUT_DMG: ${{ github.workspace }}/dist/release-assets/opencode2-cli-mac-arm64.dmg
          DMG_VOLNAME: OpenCode2 CLI (mac-arm64)
          REPORT_DIR: ${{ github.workspace }}/macos-notarization/opencode2-cli-mac-arm64
        run: ./.github/scripts/macos-signing/package_cli_dmg.sh

      - name: Upload signed opencode2 CLI DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-opencode2-cli
          path: dist/release-assets/opencode2-cli-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload opencode2 notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-opencode2-cli-notarization
          path: macos-notarization/opencode2-cli-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ inputs.publish_github_release }}
    needs:
      - resolve-version
      - package-cli
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Download signed opencode2 CLI DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-opencode2-cli
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          path="release-assets/opencode2-cli-mac-arm64.dmg"
          if [[ ! -f "$path" ]]; then
            echo "Missing ${path}" >&2
            ls -lahR release-assets || true
            exit 1
          fi
          ls -lah release-assets/

      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Signed, notarized, and stapled Apple Silicon (mac-arm64) OpenCode2 CLI."
            echo
            echo "Source: \`${{ needs.resolve-version.outputs.source }}\`"
            if [[ "${{ needs.resolve-version.outputs.source }}" == "repo" ]]; then
              echo
              echo "Built from this monorepo: real OpenCode 2.0 CLI (\`packages/cli\`) as binary \`opencode2\`,"
              echo "with workspace \`packages/tui\` (fork patches e.g. \`/transparent\`)."
              echo "Same package lineage as upstream \`@opencode-ai/cli\` / npm \`opencode2\` — not a rename of classic \`opencode\`."
              echo "Channel: \`${{ needs.resolve-version.outputs.cli_channel }}\`"
            else
              echo
              echo "npm package: \`${{ needs.resolve-version.outputs.npm_spec }}\`"
              echo "Official published binary only — **no** fork TUI patches (no \`/transparent\`)."
            fi
            echo
            echo "- \`opencode2-cli-mac-arm64.dmg\` — binary \`opencode2\`"
            echo
            echo "Version: \`${{ needs.resolve-version.outputs.release_version }}\`"
            echo "Workflow commit: \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`)."
            echo
            git log -1 --format=%B "${GITHUB_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/opencode2-cli-mac-arm64.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
