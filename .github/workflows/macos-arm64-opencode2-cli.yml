# Fork-local Apple Silicon release: signed/notarized/stapled macOS arm64 DMG
# of the official OpenCode2 CLI (same binary as `bun i -g @opencode-ai/cli@next`).
#
# Why download npm@next instead of building packages/cli from this repo?
# The published next binary is a fuller CLI (directory arg, --standalone,
# --continue, etc.) than the packages/cli tree currently on this monorepo tip.
# Building from source here produced a smaller incomplete binary (~97MB) that
# could not connect OpenCode Go and left a broken TUI. Packaging the npm next
# artifact matches the working bun install.
#
# UX: Actions → macos-arm64-opencode2-cli → Run workflow
#
# Asset: opencode2-cli-mac-arm64.dmg
# Tag:   macos-arm64-opencode2-v{npm-version}-{7-char commit sha of this workflow repo}

name: macos-arm64-opencode2-cli

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built asset
        required: false
        type: boolean
        default: true
      npm_dist_tag:
        description: npm dist-tag of @opencode-ai/cli-darwin-arm64 to sign
        required: false
        type: choice
        options:
          - next
          - beta
          - latest
          - dev
        default: next
      npm_version:
        description: >-
          Exact package version (e.g. 0.0.0-next-17028). Leave empty to use
          the selected dist-tag.
        required: false
        type: string
        default: ""
      source:
        description: >-
          Binary source. "npm" = official published CLI (recommended).
          "repo" = build packages/cli from this checkout (experimental).
        required: false
        type: choice
        options:
          - npm
          - repo
        default: npm

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.npm_version || inputs.npm_dist_tag }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      npm_spec: ${{ steps.resolve.outputs.npm_spec }}
      source: ${{ steps.resolve.outputs.source }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Resolve version from npm (or repo preview)
        id: resolve
        shell: bash
        env:
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_NPM_TAG: ${{ inputs.npm_dist_tag }}
          INPUT_NPM_VERSION: ${{ inputs.npm_version }}
        run: |
          set -euo pipefail
          source_mode="${INPUT_SOURCE:-npm}"
          short_sha="${GITHUB_SHA:0:7}"
          if [[ ! "$short_sha" =~ ^[0-9a-f]{7}$ ]]; then
            echo "Invalid GITHUB_SHA" >&2
            exit 1
          fi

          if [[ "$source_mode" == "npm" ]]; then
            if [[ -n "${INPUT_NPM_VERSION:-}" ]]; then
              npm_spec="@opencode-ai/cli-darwin-arm64@${INPUT_NPM_VERSION}"
            else
              npm_spec="@opencode-ai/cli-darwin-arm64@${INPUT_NPM_TAG:-next}"
            fi
            release_version="$(npm view "$npm_spec" version)"
            if [[ -z "$release_version" ]]; then
              echo "Could not resolve version for $npm_spec" >&2
              exit 1
            fi
            version_source="npm ${npm_spec}"
          else
            # Experimental monorepo build — preview version for this checkout.
            stamp="$(date -u +%Y%m%d%H%M)"
            release_version="0.0.0-repo-${stamp}"
            npm_spec=""
            version_source="repo packages/cli"
          fi

          release_tag="macos-arm64-opencode2-v${release_version}-${short_sha}"
          release_name="${release_version} (macos-arm64-opencode2 ${short_sha})"

          {
            echo "release_tag=${release_tag}"
            echo "release_version=${release_version}"
            echo "release_name=${release_name}"
            echo "npm_spec=${npm_spec}"
            echo "source=${source_mode}"
          } >>"$GITHUB_OUTPUT"

          echo "source=${source_mode} version=${release_version} from ${version_source}; tag=${release_tag}"

  package-cli:
    needs: resolve-version
    name: opencode2 CLI DMG
    runs-on: macos-latest
    timeout-minutes: 120
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}

      - name: Stage official npm next binary
        if: needs.resolve-version.outputs.source == 'npm'
        id: stage
        shell: bash
        env:
          NPM_SPEC: ${{ needs.resolve-version.outputs.npm_spec }}
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/opencode2-npm"
          rm -rf "$stage"
          mkdir -p "$stage"
          cd "$stage"
          # Prefer npm pack — no monorepo install required.
          tarball="$(npm pack "$NPM_SPEC" --silent)"
          tar -xzf "$tarball"
          binary=""
          for candidate in \
            package/bin/opencode2 \
            package/bin/lildax \
            package/bin/opencode2.exe \
            package/bin/lildax.exe
          do
            if [[ -f "$candidate" ]]; then
              binary="$candidate"
              break
            fi
          done
          if [[ -z "$binary" ]]; then
            echo "No CLI binary found in $NPM_SPEC" >&2
            tar -tzf "$tarball" | head -50 >&2 || true
            exit 1
          fi
          install -m 0755 "$binary" "${RUNNER_TEMP}/opencode2"
          ls -lah "${RUNNER_TEMP}/opencode2"
          file "${RUNNER_TEMP}/opencode2"
          lipo "${RUNNER_TEMP}/opencode2" -verify_arch arm64
          version_output="$("${RUNNER_TEMP}/opencode2" --version)"
          echo "version: $version_output"
          echo "path=${RUNNER_TEMP}/opencode2" >>"$GITHUB_OUTPUT"
          bytes="$(wc -c <"${RUNNER_TEMP}/opencode2" | tr -d ' ')"
          echo "binary_bytes=${bytes}"
          # Official next is ~145MB; fail early if we grabbed a stub.
          if [[ "$bytes" -lt 80000000 ]]; then
            echo "Binary is too small (${bytes} bytes); refusing to package" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup-bun
        if: needs.resolve-version.outputs.source == 'repo'

      - name: Build opencode2 from monorepo (experimental)
        if: needs.resolve-version.outputs.source == 'repo'
        id: build
        run: |
          set -euo pipefail
          ./packages/cli/script/build.ts --single --sourcemaps
          binary="packages/cli/dist/cli-darwin-arm64/bin/opencode2"
          install -m 0755 "$binary" "${RUNNER_TEMP}/opencode2"
          ls -lah "${RUNNER_TEMP}/opencode2"
          echo "path=${RUNNER_TEMP}/opencode2" >>"$GITHUB_OUTPUT"
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: next
          OPENCODE_CLI_BINARY: opencode2

      - name: Verify staged binary version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          BINARY_PATH: ${{ steps.stage.outputs.path || steps.build.outputs.path }}
        run: |
          set -euo pipefail
          binary="${BINARY_PATH}"
          if [[ ! -f "$binary" ]]; then
            echo "Missing staged binary" >&2
            exit 1
          fi
          version_output="$("$binary" --version)"
          echo "version: $version_output"
          # npm next versions are like 0.0.0-next-17028; require that string to appear.
          [[ "$version_output" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected --version to contain ${RELEASE_VERSION}, got: ${version_output}" >&2; exit 1; }
          lipo "$binary" -verify_arch arm64

      - name: Sign, notarize, and staple opencode2 DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY_PATH: ${{ steps.stage.outputs.path || steps.build.outputs.path }}
          BINARY_NAME: opencode2
          OUTPUT_DMG: ${{ github.workspace }}/dist/release-assets/opencode2-cli-mac-arm64.dmg
          DMG_VOLNAME: OpenCode2 CLI (mac-arm64)
          REPORT_DIR: ${{ github.workspace }}/macos-notarization/opencode2-cli-mac-arm64
        run: ./.github/scripts/macos-signing/package_cli_dmg.sh

      - name: Upload signed opencode2 CLI DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-opencode2-cli
          path: dist/release-assets/opencode2-cli-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload opencode2 notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-opencode2-cli-notarization
          path: macos-notarization/opencode2-cli-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ inputs.publish_github_release }}
    needs:
      - resolve-version
      - package-cli
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Download signed opencode2 CLI DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-opencode2-cli
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          path="release-assets/opencode2-cli-mac-arm64.dmg"
          if [[ ! -f "$path" ]]; then
            echo "Missing ${path}" >&2
            ls -lahR release-assets || true
            exit 1
          fi
          ls -lah release-assets/

      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Signed, notarized, and stapled Apple Silicon (mac-arm64) OpenCode2 CLI."
            echo
            echo "Source: \`${{ needs.resolve-version.outputs.source }}\`"
            if [[ "${{ needs.resolve-version.outputs.source }}" == "npm" ]]; then
              echo "npm package: \`${{ needs.resolve-version.outputs.npm_spec }}\`"
              echo
              echo "This is the **same binary** as \`bun i -g @opencode-ai/cli@next\` /"
              echo "\`@opencode-ai/cli-darwin-arm64@${{ needs.resolve-version.outputs.release_version }}\`,"
              echo "packaged with Developer ID + notarization for Gatekeeper."
            else
              echo "Built experimentally from this monorepo's \`packages/cli\`."
            fi
            echo
            echo "- \`opencode2-cli-mac-arm64.dmg\` — binary \`opencode2\`"
            echo
            echo "Version: \`${{ needs.resolve-version.outputs.release_version }}\`"
            echo
            echo "Workflow commit: \`${GITHUB_SHA}\` (\`${GITHUB_REF_NAME}\`)."
            echo
            git log -1 --format=%B "${GITHUB_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/opencode2-cli-mac-arm64.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
