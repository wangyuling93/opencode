# Fork-local Apple Silicon release: signed, notarized, and stapled macOS arm64
# DMG for the preview CLI from packages/cli (binary name: opencode2).
#
# UX: one manual click — Actions → macos-arm64-opencode2-cli → Run workflow
#
# This is separate from macos-arm64-signed (classic opencode + desktop).
# Source: packages/cli  →  binary opencode2  →  opencode2-cli-mac-arm64.dmg
#
# codesigning environment (secrets/vars):
#   secrets: APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD,
#            APPLE_APP_SPECIFIC_PASSWORD
#   variables: APPLE_ID, APPLE_TEAM_ID
#
# Setup:
#   ./.github/scripts/setup-macos-signing-secrets.sh --repo OWNER/REPO
#
# Asset: opencode2-cli-mac-arm64.dmg
# Tag:   macos-arm64-opencode2-v{version}-{7-char commit sha}

name: macos-arm64-opencode2-cli

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built asset
        required: false
        type: boolean
        default: true
      release_version:
        description: >-
          Version embedded in the binary. Leave empty to use
          packages/cli/package.json (for example, 1.18.15).
        required: false
        type: string
        default: ""
      channel:
        description: CLI channel embedded in the binary (prod → latest, beta, or dev)
        required: false
        type: choice
        options:
          - prod
          - beta
          - dev
        default: prod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      cli_channel: ${{ steps.resolve.outputs.cli_channel }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: resolve
        shell: bash
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          WORKSPACE: ${{ github.workspace }}
          PACKAGE_JSON: ${{ github.workspace }}/packages/cli/package.json
          TAG_PREFIX: macos-arm64-opencode2-v
          RELEASE_LABEL: macos-arm64-opencode2
        run: ./.github/scripts/macos-signing/resolve_release.sh

  package-cli:
    needs: resolve-version
    name: opencode2 CLI DMG
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=darwin --cpu=arm64

      - name: Build opencode2 CLI (darwin-arm64)
        run: ./packages/cli/script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.cli_channel }}
          OPENCODE_CLI_BINARY: opencode2

      - name: Verify opencode2 binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
        run: |
          set -euo pipefail
          binary="packages/cli/dist/cli-darwin-arm64/bin/opencode2"
          if [[ ! -f "$binary" ]]; then
            echo "Missing CLI binary: $binary" >&2
            ls -lahR packages/cli/dist || true
            exit 1
          fi
          chmod 0755 "$binary"
          version_output="$("$binary" --version)"
          echo "$version_output"
          [[ "$version_output" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected opencode2 --version to contain ${RELEASE_VERSION}" >&2; exit 1; }
          lipo "$binary" -verify_arch arm64

      - name: Sign, notarize, and staple opencode2 DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY_PATH: ${{ github.workspace }}/packages/cli/dist/cli-darwin-arm64/bin/opencode2
          BINARY_NAME: opencode2
          OUTPUT_DMG: ${{ github.workspace }}/dist/release-assets/opencode2-cli-mac-arm64.dmg
          DMG_VOLNAME: OpenCode2 CLI (mac-arm64)
          REPORT_DIR: ${{ github.workspace }}/macos-notarization/opencode2-cli-mac-arm64
        run: ./.github/scripts/macos-signing/package_cli_dmg.sh

      - name: Upload signed opencode2 CLI DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-opencode2-cli
          path: dist/release-assets/opencode2-cli-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload opencode2 notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-opencode2-cli-notarization
          path: macos-notarization/opencode2-cli-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: ${{ inputs.publish_github_release }}
    needs:
      - resolve-version
      - package-cli
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Download signed opencode2 CLI DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-opencode2-cli
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          path="release-assets/opencode2-cli-mac-arm64.dmg"
          if [[ ! -f "$path" ]]; then
            echo "Missing ${path}" >&2
            ls -lahR release-assets || true
            exit 1
          fi
          ls -lah release-assets/

      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Signed, notarized, and stapled Apple Silicon (mac-arm64) build of the preview CLI (\`opencode2\`) from \`packages/cli\`."
            echo
            echo "Asset (hard-verified for codesign + staple before publish):"
            echo
            echo "- \`opencode2-cli-mac-arm64.dmg\` — preview CLI binary \`opencode2\`"
            echo
            echo "Channel: \`${{ needs.resolve-version.outputs.channel }}\`"
            echo
            echo "Built from \`${GITHUB_SHA}\` on branch \`${GITHUB_REF_NAME}\`."
            echo
            echo "This is **not** the classic \`opencode\` CLI (that is \`macos-arm64-signed\`)."
            echo
            git log -1 --format=%B "${GITHUB_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/opencode2-cli-mac-arm64.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
