# Fork-local Apple Silicon release: signed, notarized, and stapled macOS arm64
# DMGs for desktop + CLI.
#
# UX: one manual click — Actions → macos-arm64-signed → Run workflow
#     (uncheck "Build and release the desktop DMG" for CLI-only builds)
#
# Channel (drives both desktop and CLI):
#   prod  — dev branch, classic opencode CLI (packages/opencode)
#   beta  — v2 branch, opencode2 CLI (packages/cli) + desktop
#
# beta jobs check out ref v2, so local actions/scripts must exist there too:
# .github/actions/macos-codesigning-setup and .github/scripts/macos-signing
# are mirrored onto the v2 branch — keep them in sync when they change here.
#
# resolve-version records the commit it checked out (built_sha); package-*
# and publish pin their checkout to it so a moving branch ref cannot shift
# the build away from the commit the tag/notes are bound to.
#
# Internal graph (match upstream publish.yml: Vite + bun compile on Linux,
# macOS only signs and packages — Darwin ARM Vite OOMs at Node's default heap):
#
#   resolve-version
#     └── build-cli         (Linux: Vite + compile darwin-arm64)
#           ├── package-cli      (macOS: sign + notarize CLI DMG)
#           └── package-desktop  (macOS: embed downloaded CLI, sign desktop;
#                                 skipped when build_desktop=false)
#                    └── publish (optional; waits for both that run)
#
# Beta (v2) compile must match upstream publish.yml: Bun canary +
# BUN_COMPILE_RELEASE=canary. Current v2 always passes compile.executablePath;
# leaving that unset makes Bun 1.3.14 reject the build.
# Desktop embeds that same-commit CLI via OPENCODE_CLI_DIST (v2 prebuild
# otherwise downloads npm @beta, which is a stale tarball without bin/opencode2).
#
# codesigning environment (secrets/vars):
#   secrets: APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD,
#            APPLE_APP_SPECIFIC_PASSWORD
#   variables: APPLE_ID, APPLE_TEAM_ID
#
# Setup:
#   ./.github/scripts/setup-macos-signing-secrets.sh --repo OWNER/REPO
#
# Assets:
#   opencode-desktop-mac-arm64.dmg
#   opencode-cli-mac-arm64.dmg (opencode on prod, opencode2 on beta)
# Tag: macos-arm64-v{version}-{7-char commit sha}

name: macos-arm64-signed

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built assets
        required: false
        type: boolean
        default: true
      release_version:
        description: >-
          Version embedded in the binaries. Leave empty to use the package
          version (packages/opencode on prod, packages/desktop on beta).
        required: false
        type: string
        default: ""
      channel:
        description: >-
          Channel for both desktop and CLI. prod builds the dev branch;
          beta builds the v2 branch (opencode2 CLI + desktop).
        required: false
        type: choice
        options:
          - prod
          - beta
        default: prod
      build_desktop:
        description: Build and release the desktop DMG too. Uncheck to build and release only the CLI DMG.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel }}-${{ inputs.release_version || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      cli_channel: ${{ steps.resolve.outputs.cli_channel }}
      built_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ inputs.channel == 'beta' && 'v2' || github.ref }}
          persist-credentials: false

      # The dispatch SHA belongs to the branch the workflow file lives on (dev);
      # beta builds from v2, so bind the tag and release to the commit actually built.
      - name: Resolve built commit
        id: sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Resolve release version and tag
        id: resolve
        shell: bash
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          GITHUB_SHA: ${{ steps.sha.outputs.sha }}
          # prod (dev branch) tracks the classic CLI version; beta (v2 branch)
          # has no packages/opencode, so desktop tracks the release cadence.
          # Note: the opencode2 binary embeds this version, so its npm-channel
          # auto-update no-ops when it is above the published @opencode-ai/cli.
          PACKAGE_JSON: ${{ inputs.channel == 'beta' && 'packages/desktop/package.json' || 'packages/opencode/package.json' }}
          WORKSPACE: ${{ github.workspace }}
        run: ./.github/scripts/macos-signing/resolve_release.sh

  build-cli:
    needs: resolve-version
    if: github.repository != 'anomalyco/opencode'
    name: Build CLI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # GitHub-hosted Linux is 7GB; 4GB leaves room for Bun. Do not use 8GB here.
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          ref: ${{ needs.resolve-version.outputs.built_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        if: inputs.channel != 'beta'

      # v2 setup-bun accepts bun-version; the prod (dev) action copy does not.
      - uses: ./.github/actions/setup-bun
        if: inputs.channel == 'beta'
        with:
          bun-version: canary

      - name: Build darwin-arm64 CLI
        # Cross-compile from Linux like upstream publish.yml. --single would
        # emit a linux binary; --target selects the macOS artifact we sign.
        run: ${{ inputs.channel == 'beta' && 'bun ./packages/cli/script/build.ts --target=opencode2-darwin-arm64' || './packages/opencode/script/build.ts --target=opencode-darwin-arm64' }}
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.cli_channel }}
          BUN_COMPILE_RELEASE: ${{ inputs.channel == 'beta' && 'canary' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check CLI artifact
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" == "beta" ]]; then
            binary="packages/cli/dist/cli-darwin-arm64/bin/opencode2"
            dist_dir="packages/cli/dist/cli-darwin-arm64"
          else
            binary="packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
            dist_dir="packages/opencode/dist/opencode-darwin-arm64"
          fi
          if [[ ! -f "$binary" ]]; then
            echo "Missing CLI binary: $binary" >&2
            ls -lahR "$(dirname "$dist_dir")" || true
            exit 1
          fi
          file "$binary"

      - name: Upload unsigned CLI
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-unsigned-cli
          path: ${{ inputs.channel == 'beta' && 'packages/cli/dist/cli-darwin-arm64' || 'packages/opencode/dist/opencode-darwin-arm64' }}
          if-no-files-found: error
          retention-days: 7

  package-cli:
    needs:
      - resolve-version
      - build-cli
    name: CLI DMG
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          # Pin to the commit resolve-version resolved, so a moving branch ref
          # cannot shift the build away from the tag/notes it is released under.
          ref: ${{ needs.resolve-version.outputs.built_sha }}
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}

      - name: Download unsigned CLI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-unsigned-cli
          path: ${{ inputs.channel == 'beta' && 'packages/cli/dist/cli-darwin-arm64' || 'packages/opencode/dist/opencode-darwin-arm64' }}

      - name: Verify CLI binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [[ "${CHANNEL}" == "beta" ]]; then
            binary="packages/cli/dist/cli-darwin-arm64/bin/opencode2"
            dist_dir="packages/cli/dist"
          else
            binary="packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
            dist_dir="packages/opencode/dist"
          fi
          if [[ ! -f "$binary" ]]; then
            echo "Missing CLI binary: $binary" >&2
            ls -lahR "$dist_dir" || true
            exit 1
          fi
          chmod 0755 "$binary"
          version_output="$("$binary" --version)"
          echo "$version_output"
          [[ "$version_output" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected CLI --version to contain ${RELEASE_VERSION}" >&2; exit 1; }
          lipo "$binary" -verify_arch arm64

      - name: Sign, notarize, and staple CLI DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          BINARY_PATH: ${{ inputs.channel == 'beta' && 'packages/cli/dist/cli-darwin-arm64/bin/opencode2' || 'packages/opencode/dist/opencode-darwin-arm64/bin/opencode' }}
          BINARY_NAME: ${{ inputs.channel == 'beta' && 'opencode2' || 'opencode' }}
        run: ./.github/scripts/macos-signing/package_cli_dmg.sh

      - name: Upload signed CLI DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-cli
          path: dist/release-assets/opencode-cli-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload CLI notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-cli-notarization
          path: macos-notarization/cli-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

  package-desktop:
    needs:
      - resolve-version
      - build-cli
    if: github.repository != 'anomalyco/opencode' && inputs.build_desktop
    name: Desktop DMG
    runs-on: macos-26
    timeout-minutes: 180
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
      # packages/app Vite (Mermaid + sourcemaps) exceeds Node's default ~2GB heap.
      NODE_OPTIONS: --max-old-space-size=8192
      # bun run build re-runs the `prebuild` lifecycle script. Keep this set
      # for every desktop step so that path does not fall back to npm @beta.
      OPENCODE_CLI_DIST: ${{ inputs.channel == 'beta' && format('{0}/packages/cli/dist', github.workspace) || '' }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          # Pin to the commit resolve-version resolved (see package-cli).
          ref: ${{ needs.resolve-version.outputs.built_sha }}
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}
          # electron-builder finds the identity via CSC_KEYCHAIN; no SIGNING_IDENTITY needed.
          resolve-identity: "false"

      - uses: ./.github/actions/setup-bun
        if: inputs.channel != 'beta'
        with:
          install-flags: --os=darwin --cpu=arm64

      - uses: ./.github/actions/setup-bun
        if: inputs.channel == 'beta'
        with:
          install-flags: --os=darwin --cpu=arm64
          bun-version: canary

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Same-commit opencode2 from the Linux build. v2 prebuild only copies a
      # local build when OPENCODE_CLI_DIST is set; otherwise it fetches npm
      # @beta (bin/lildax, not bin/opencode2).
      - name: Download unsigned CLI
        if: inputs.channel == 'beta'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-unsigned-cli
          path: packages/cli/dist/cli-darwin-arm64

      - name: Prepare desktop
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          RUST_TARGET: aarch64-apple-darwin

      - name: Build desktop
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}

      - name: Drop CLI build tree after embed
        if: inputs.channel == 'beta'
        run: rm -rf packages/cli/dist

      # Keep node_modules/dist (electron-builder needs them); only drop caches.
      - name: Free runner caches before packaging
        env:
          FREE_PACKAGING_KEEP_NODE_MODULES: "true"
          FREE_PACKAGING_KEEP_DIST: "true"
        run: ./.github/scripts/macos-signing/free_packaging_space.sh

      - name: Package signed desktop DMG
        # electron-builder notarize:true uploads the .app to Apple; that upload
        # occasionally connectTimeouts. Retry here instead of re-running the job.
        working-directory: packages/desktop
        timeout-minutes: 90
        env:
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          CSC_KEYCHAIN: build.keychain
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "electron-builder attempt ${attempt}/3"
            if npx electron-builder --mac dmg --arm64 --publish never --config electron-builder.config.ts; then
              exit 0
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "Package/notarize failed; retrying in 30s..."
            rm -rf dist/mac-arm64
            sleep 30
          done


      - name: Notarize and staple desktop DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          REPORT_DIR: ${{ github.workspace }}/macos-notarization/desktop-mac-arm64
        run: ./.github/scripts/macos-signing/notarize_and_staple_dmg.sh packages/desktop/dist/opencode-desktop-mac-arm64.dmg

      - name: Verify desktop DMG
        run: ./.github/scripts/macos-signing/verify_desktop_dmg.sh packages/desktop/dist/opencode-desktop-mac-arm64.dmg

      - name: Upload signed desktop DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-desktop
          path: packages/desktop/dist/opencode-desktop-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-desktop-notarization
          path: macos-notarization/desktop-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop dist listing (debug)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-desktop-dist-debug
          path: packages/desktop/dist/
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: ${{ !cancelled() && inputs.publish_github_release && needs.package-cli.result == 'success' && (needs.package-desktop.result == 'success' || needs.package-desktop.result == 'skipped') }}
    needs:
      - resolve-version
      - package-cli
      - package-desktop
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          # Same pinned commit the DMGs were built from (see package-cli).
          ref: ${{ needs.resolve-version.outputs.built_sha }}
          persist-credentials: false

      - name: Download signed CLI DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-cli
          path: release-assets

      - name: Download signed desktop DMG
        if: inputs.build_desktop
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-desktop
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "release-assets/opencode-cli-mac-arm64.dmg" ]]; then
            echo "Missing release-assets/opencode-cli-mac-arm64.dmg" >&2
            ls -lahR release-assets || true
            exit 1
          fi
          if [[ "${{ inputs.build_desktop }}" == "true" ]]; then
            if [[ ! -f "release-assets/opencode-desktop-mac-arm64.dmg" ]]; then
              echo "Missing release-assets/opencode-desktop-mac-arm64.dmg" >&2
              ls -lahR release-assets || true
              exit 1
            fi
          fi
          ls -lah release-assets/

      - name: Compute release asset list
        id: assets
        shell: bash
        run: |
          {
            echo "files<<EOF"
            echo "release-assets/opencode-cli-mac-arm64.dmg"
            if [[ "${{ inputs.build_desktop }}" == "true" ]]; then
              echo "release-assets/opencode-desktop-mac-arm64.dmg"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Release notes
        id: notes
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          BUILT_SHA: ${{ needs.resolve-version.outputs.built_sha }}
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          # beta checks out v2, so the dispatch SHA (dev) is not in this clone.
          if ! git cat-file -e "${BUILT_SHA}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${BUILT_SHA}"
          fi
          {
            echo "Signed, notarized, and stapled Apple Silicon (mac-arm64) builds."
            echo
            if [[ "${{ inputs.build_desktop }}" == "true" ]]; then
              echo "Assets (each hard-verified for codesign + staple before publish):"
            else
              echo "Asset (hard-verified for codesign + staple before publish):"
            fi
            echo
            if [[ "${CHANNEL}" == "beta" ]]; then
              echo "- \`opencode-cli-mac-arm64.dmg\` — opencode2 terminal CLI (\`opencode2\`)"
            else
              echo "- \`opencode-cli-mac-arm64.dmg\` — terminal CLI (\`opencode\`)"
            fi
            if [[ "${{ inputs.build_desktop }}" == "true" ]]; then
              echo "- \`opencode-desktop-mac-arm64.dmg\` — desktop app"
            fi
            echo
            echo "Channel: \`${{ needs.resolve-version.outputs.channel }}\`"
            echo
            echo "Built from \`${BUILT_SHA}\`."
            echo
            git log -1 --format=%B "${BUILT_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ needs.resolve-version.outputs.built_sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: ${{ steps.assets.outputs.files }}
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
