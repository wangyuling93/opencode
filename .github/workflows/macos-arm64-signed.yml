# Fork-local Apple Silicon release: signed, notarized, and stapled macOS arm64
# DMGs for desktop + CLI.
#
# UX: one manual click — Actions → macos-arm64-signed → Run workflow
#
# Internal graph (parallel after resolve; free minutes on public repos favor
# wall-clock over serializing on one runner):
#
#   resolve-version
#     ├── package-cli      (build + sign + notarize CLI DMG)
#     └── package-desktop  (build + sign + notarize desktop DMG)
#              └── publish (optional; waits for both)
#
# codesigning environment (secrets/vars):
#   secrets: APPLE_DEVELOPER_ID_P12, APPLE_DEVELOPER_ID_P12_PASSWORD,
#            APPLE_APP_SPECIFIC_PASSWORD
#   variables: APPLE_ID, APPLE_TEAM_ID
#
# Setup:
#   ./.github/scripts/setup-macos-signing-secrets.sh --repo OWNER/REPO
#
# Assets:
#   opencode-desktop-mac-arm64.dmg
#   opencode-cli-mac-arm64.dmg
# Tag: macos-arm64-v{version}-{7-char commit sha}

name: macos-arm64-signed

on:
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: Create a GitHub prerelease (and tag) from the built assets
        required: false
        type: boolean
        default: true
      release_version:
        description: >-
          Version embedded in the binaries. Leave empty to use
          packages/opencode/package.json (for example, 1.18.15).
        required: false
        type: string
        default: ""
      channel:
        description: Desktop channel (prod, beta, or dev)
        required: false
        type: choice
        options:
          - prod
          - beta
          - dev
        default: prod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release_version || github.sha }}
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository != 'anomalyco/opencode'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      channel: ${{ steps.resolve.outputs.channel }}
      cli_channel: ${{ steps.resolve.outputs.cli_channel }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Resolve release version and tag
        id: resolve
        shell: bash
        env:
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          WORKSPACE: ${{ github.workspace }}
        run: ./.github/scripts/macos-signing/resolve_release.sh

  package-cli:
    needs: resolve-version
    name: CLI DMG
    runs-on: macos-26
    timeout-minutes: 120
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=darwin --cpu=arm64

      - name: Build CLI (darwin-arm64)
        run: ./packages/opencode/script/build.ts --single
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.cli_channel }}

      - name: Verify CLI binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
        run: |
          set -euo pipefail
          binary="packages/opencode/dist/opencode-darwin-arm64/bin/opencode"
          if [[ ! -f "$binary" ]]; then
            echo "Missing CLI binary: $binary" >&2
            ls -lahR packages/opencode/dist || true
            exit 1
          fi
          chmod 0755 "$binary"
          version_output="$("$binary" --version)"
          echo "$version_output"
          [[ "$version_output" == *"${RELEASE_VERSION}"* ]] \
            || { echo "Expected opencode --version to contain ${RELEASE_VERSION}" >&2; exit 1; }
          lipo "$binary" -verify_arch arm64

      - name: Sign, notarize, and staple CLI DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./.github/scripts/macos-signing/package_cli_dmg.sh

      - name: Upload signed CLI DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-cli
          path: dist/release-assets/opencode-cli-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload CLI notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-cli-notarization
          path: macos-notarization/cli-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

  package-desktop:
    needs: resolve-version
    name: Desktop DMG
    runs-on: macos-26
    timeout-minutes: 180
    environment:
      name: codesigning
    permissions:
      contents: read
    env:
      SIGNING_KEYCHAIN: build.keychain
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/macos-codesigning-setup
        with:
          apple-developer-id-p12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          apple-developer-id-p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          apple-app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          apple-id: ${{ vars.APPLE_ID }}
          apple-team-id: ${{ vars.APPLE_TEAM_ID }}
          # electron-builder finds the identity via CSC_KEYCHAIN; no SIGNING_IDENTITY needed.
          resolve-identity: "false"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: --os=darwin --cpu=arm64

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Prepare desktop
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          RUST_TARGET: aarch64-apple-darwin

      - name: Build desktop
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_VERSION: ${{ needs.resolve-version.outputs.release_version }}
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}

      # Keep node_modules/dist (electron-builder needs them); only drop caches.
      - name: Free runner caches before packaging
        env:
          FREE_PACKAGING_KEEP_NODE_MODULES: "true"
          FREE_PACKAGING_KEEP_DIST: "true"
        run: ./.github/scripts/macos-signing/free_packaging_space.sh

      - name: Package signed desktop DMG
        # electron-builder notarize:true staples the .app; outer DMG stapled next.
        run: npx electron-builder --mac dmg --arm64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: ${{ needs.resolve-version.outputs.channel }}
          CSC_KEYCHAIN: build.keychain
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}

      - name: Notarize and staple desktop DMG
        env:
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          REPORT_DIR: ${{ github.workspace }}/macos-notarization/desktop-mac-arm64
        run: ./.github/scripts/macos-signing/notarize_and_staple_dmg.sh packages/desktop/dist/opencode-desktop-mac-arm64.dmg

      - name: Verify desktop DMG
        run: ./.github/scripts/macos-signing/verify_desktop_dmg.sh packages/desktop/dist/opencode-desktop-mac-arm64.dmg

      - name: Upload signed desktop DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-signed-desktop
          path: packages/desktop/dist/opencode-desktop-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

      - name: Upload desktop notarization report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-desktop-notarization
          path: macos-notarization/desktop-mac-arm64/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload desktop dist listing (debug)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64-desktop-dist-debug
          path: packages/desktop/dist/
          if-no-files-found: warn
          retention-days: 7

  publish:
    if: ${{ inputs.publish_github_release }}
    needs:
      - resolve-version
      - package-cli
      - package-desktop
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Download signed CLI DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-cli
          path: release-assets

      - name: Download signed desktop DMG
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-arm64-signed-desktop
          path: release-assets

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            release-assets/opencode-cli-mac-arm64.dmg \
            release-assets/opencode-desktop-mac-arm64.dmg
          do
            if [[ ! -f "$path" ]]; then
              echo "Missing ${path}" >&2
              ls -lahR release-assets || true
              exit 1
            fi
          done
          ls -lah release-assets/

      - name: Release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          {
            echo "Signed, notarized, and stapled Apple Silicon (mac-arm64) builds."
            echo
            echo "Assets (each hard-verified for codesign + staple before publish):"
            echo
            echo "- \`opencode-desktop-mac-arm64.dmg\` — desktop app"
            echo "- \`opencode-cli-mac-arm64.dmg\` — terminal CLI (\`opencode\`)"
            echo
            echo "Channel: \`${{ needs.resolve-version.outputs.channel }}\`"
            echo
            echo "Built from \`${GITHUB_SHA}\`."
            echo
            git log -1 --format=%B "${GITHUB_SHA}^{commit}"
          } > "${notes_path}"
          echo "path=${notes_path}" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.resolve-version.outputs.release_name }}
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/opencode-cli-mac-arm64.dmg
            release-assets/opencode-desktop-mac-arm64.dmg
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
          prerelease: true
